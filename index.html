<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>SPCOA Mesoanalysis</title>


    <!-- ===================================================
         MAPLIBRE GL JS
         
         Version 6.10.0
    ==================================================== -->

    <link
        href="https://unpkg.com/maplibre-gl@6.10.0/dist/maplibre-gl.css"
        rel="stylesheet"
    >


    <!-- ===================================================
         OUR CSS
    ==================================================== -->

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


    <!-- ===================================================
         HEADER
    ==================================================== -->

    <header class="site-header">

        <div class="header-text">

            <h1>
                SPCOA Mesoanalysis
            </h1>

            <p>
                Interactive Surface and Mesoanalysis Viewer
            </p>

        </div>

    </header>


    <!-- ===================================================
         APPLICATION
    ==================================================== -->

    <main class="app">


        <!-- ===============================================
             SIDEBAR
        ================================================ -->

        <aside class="sidebar">


            <!-- ===========================================
                 SECTOR
            ============================================ -->

            <section class="sidebar-section">

                <h2>
                    Sector
                </h2>


                <select id="sector-select">

                    <option value="lbf">
                        LBF CWA
                    </option>

                    <option value="regional">
                        LBF Regional
                    </option>

                    <option value="central_plains">
                        Central Plains
                    </option>

                    <option value="conus">
                        CONUS
                    </option>

                </select>

            </section>


            <!-- ===========================================
                 MAP FEATURES
            ============================================ -->

            <section class="sidebar-section">

                <h2>
                    Map Features
                </h2>


                <!-- STATES -->

                <label class="checkbox-row">

                    <input
                        id="states-toggle"
                        type="checkbox"
                        checked
                    >

                    <span>
                        States
                    </span>

                </label>


                <!-- COUNTIES -->

                <label class="checkbox-row">

                    <input
                        id="counties-toggle"
                        type="checkbox"
                        checked
                    >

                    <span>
                        Counties
                    </span>

                </label>


                <!-- CWA BOUNDARIES
                     
                     We are leaving these disabled for now.
                -->

                <label class="checkbox-row">

                    <input
                        id="cwa-toggle"
                        type="checkbox"
                        disabled
                    >

                    <span>
                        CWA Boundaries
                    </span>

                </label>


                <!-- CITIES -->

                <label class="checkbox-row">

                    <input
                        id="cities-toggle"
                        type="checkbox"
                        checked
                    >

                    <span>
                        Cities
                    </span>

                </label>


                <!-- HIGHWAYS / PRIMARY ROADS -->

                <label class="checkbox-row">

                    <input
                        id="highways-toggle"
                        type="checkbox"
                        checked
                    >

                    <span>
                        Highways
                    </span>

                </label>

            </section>


            <!-- ===========================================
                 CWA
                 
                 Leaving this alone for now.
            ============================================ -->

            <section class="sidebar-section">

                <h2>
                    CWA
                </h2>


                <select
                    id="cwa-select"
                    disabled
                >

                    <option>
                        Coming Later
                    </option>

                </select>


                <p class="help-text">

                    CWA boundaries and office selection
                    will be added later.

                </p>

            </section>


            <!-- ===========================================
                 SPCOA FIELDS
            ============================================ -->

            <section
                class="sidebar-section weather-placeholder"
            >

                <h2>
                    SPCOA Fields
                </h2>


                <p>

                    Weather parameters will be added after
                    the geographic map is complete.

                </p>

            </section>


        </aside>


        <!-- ===============================================
             MAP
        ================================================ -->

        <section class="map-wrapper">

            <div id="map"></div>

        </section>


    </main>


    <!-- ===================================================
         MAPLIBRE GL JS
         
         Version 6.10.0
    ==================================================== -->

    <script
        src="https://unpkg.com/maplibre-gl@6.10.0/dist/maplibre-gl.js">
    </script>


    <!-- ===================================================
         TOPOJSON CLIENT
         
         Converts our local counties-10m.json TopoJSON
         geography into GeoJSON that MapLibre can render.
    ==================================================== -->

    <script
        src="https://unpkg.com/topojson-client@3/dist/topojson-client.min.js">
    </script>


    <!-- ===================================================
         OUR JAVASCRIPT
    ==================================================== -->

    <script src="app.js"></script>


</body>

</html>
