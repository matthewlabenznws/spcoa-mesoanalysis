name: SPCOA Sounding Diagnostics API - Deploy
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: spcoa-sounding-api-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      AWS_DEFAULT_REGION: us-east-2
      ECR_REPOSITORY: 723468358419.dkr.ecr.us-east-2.amazonaws.com/spcoasoundingdiagnostics63cafd0d/soundingfunction0f6728a1repo
      CFN_EXECUTION_ROLE: arn:aws:iam::723468358419:role/SPCOA-Sounding-CloudFormationExecution
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Authenticate with AWS using GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          aws-region: us-east-2
          role-to-assume: arn:aws:iam::723468358419:role/SPCOASoundingGitHubDeploy
          role-session-name: SPCOASounding-${{ github.run_id }}

      - name: Verify AWS account and existing ECR repository
        run: |
          aws sts get-caller-identity
          aws ecr describe-repositories \
            --region "$AWS_DEFAULT_REGION" \
            --repository-names spcoasoundingdiagnostics63cafd0d/soundingfunction0f6728a1repo \
            --query 'repositories[0].repositoryUri' --output text

      - name: Install AWS SAM
        uses: aws-actions/setup-sam@v2

      - name: Check Python and template files
        run: |
          test -f spcoa_soundings.py
          test -f spcoa_sounding_diagnostics.py
          test -f spcoa_sounding_api.py
          test -f Dockerfile.sounding-api
          test -f template.sounding-api.yaml
          python -m py_compile spcoa_soundings.py spcoa_sounding_diagnostics.py spcoa_sounding_api.py

      - name: Build sounding Lambda image
        run: sam build --template-file template.sounding-api.yaml --use-container

      - name: Deploy sounding API (existing ECR repository, CloudFormation role)
        run: |
          sam deploy \
            --template-file .aws-sam/build/template.yaml \
            --stack-name spcoa-sounding-diagnostics \
            --region "$AWS_DEFAULT_REGION" \
            --s3-bucket spcoa-mesoanalysis \
            --s3-prefix sam-deploy/spcoa-sounding-api \
            --image-repositories "SoundingFunction=$ECR_REPOSITORY" \
            --parameter-overrides "ParameterKey=AllowedOrigin,ParameterValue=https://matthewlabenznws.github.io" \
            --role-arn "$CFN_EXECUTION_ROLE" \
            --capabilities CAPABILITY_IAM \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset

      - name: Show diagnostics endpoint
        run: |
          aws cloudformation describe-stacks \
            --stack-name spcoa-sounding-diagnostics \
            --region "$AWS_DEFAULT_REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='DiagnosticsApiUrl'].OutputValue" \
            --output text
